name: Validate and Deploy Documentation

env:
  DOXYGEN_VERSION: "1.14.0"
  DOXYGEN_RELEASE: "Release_1_14_0"
  DOXYGEN_LINUX_SHA256: "e5d6ae24d0bf3f0cdc4d8f146726b89ca323922f19441af99b1872d503665ad6"

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-docs:
    name: Validate Doxygen
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz cmake ninja-build

          archive="$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz"
          curl --fail --location --silent --show-error \
            "https://github.com/doxygen/doxygen/releases/download/${DOXYGEN_RELEASE}/doxygen-${DOXYGEN_VERSION}.linux.bin.tar.gz" \
            --output "$archive"
          echo "${DOXYGEN_LINUX_SHA256}  ${archive}" | sha256sum --check
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/doxygen-${DOXYGEN_VERSION}/bin" >> "$GITHUB_PATH"

      - name: Verify documentation toolchain
        run: |
          doxygen --version
          dot -V
          cmake --version

      # Foundation is fetched by cmake/DspCoreFoundation.cmake when no compatible
      # local package is available. RoModularBuild comes from the pinned
      # repository submodule.
      - name: Build documentation
        shell: bash
        run: |
          set -o pipefail
          mkdir -p build/ci-logs
          bash ./scripts/docs.sh --fresh 2>&1 | tee build/ci-logs/documentation.log

      - name: Reject Doxygen warnings
        shell: bash
        run: |
          if grep -E "warning:" build/ci-logs/documentation.log; then
            echo "Doxygen reported warnings" >&2
            exit 1
          fi

      - name: Upload documentation failure evidence
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: failure-documentation-${{ github.run_attempt }}
          path: |
            build/ci-logs/documentation.log
            build/documentation/CMakeCache.txt
            build/documentation/CMakeFiles/CMakeConfigureLog.yaml
            build/documentation/docs/Doxyfile
          if-no-files-found: warn
          retention-days: 14

      - name: Upload validated documentation
        uses: actions/upload-artifact@v7
        with:
          name: dspcore-documentation
          path: build/documentation/docs/html
          if-no-files-found: error
          retention-days: 7

  deploy-docs:
    name: Deploy to docs branch
    if: github.event_name != 'pull_request'
    needs: validate-docs
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - name: Download validated documentation
        uses: actions/download-artifact@v7
        with:
          name: dspcore-documentation
          path: build/documentation/docs/html

      - name: Deploy to docs branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: docs
          publish_dir: build/documentation/docs/html
          force_orphan: true
